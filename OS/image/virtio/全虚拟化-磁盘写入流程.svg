<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="1100" height="980">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 24px; font-weight: 600; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .layer-title { font-size: 15px; font-weight: 600; fill: #374151; }
    .node-title { font-size: 16px; font-weight: 600; fill: #111827; }
    .node-sub { font-size: 13px; fill: #6b7280; }
    .label { font-size: 13px; fill: #374151; }
    .callout-title { font-size: 14px; font-weight: 600; fill: #991b1b; }
    .callout-sub { font-size: 13px; fill: #7f1d1d; }
    .step { font-size: 13px; font-weight: 600; fill: #ffffff; }
  </style>
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
  </defs>
  <rect width="1100" height="980" fill="#ffffff"/>
  <text x="50" y="45" class="title">全设备虚拟化：磁盘写入流程</text>
  <text x="50" y="72" class="subtitle">Guest 使用传统磁盘驱动，VMM/QEMU 模拟完整的物理磁盘控制器</text>

  <rect x="50" y="105" width="1000" height="300" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" data-graph-role="container" data-container-id="guest"/>
  <text x="75" y="135" class="layer-title">Guest 虚拟机</text>
  <rect x="50" y="440" width="1000" height="185" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" data-graph-role="container" data-container-id="vmm"/>
  <text x="75" y="470" class="layer-title">VMM / QEMU 设备模拟层</text>
  <rect x="50" y="660" width="1000" height="150" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" data-graph-role="container" data-container-id="host"/>
  <text x="75" y="690" class="layer-title">宿主机</text>
  <rect x="50" y="845" width="1000" height="80" rx="14" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5" data-graph-role="container" data-container-id="hardware"/>
  <text x="75" y="875" class="layer-title">物理硬件</text>

  <g><rect x="370" y="155" width="360" height="64" rx="9" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><circle cx="398" cy="187" r="16" fill="#2563eb"/><text x="398" y="192" text-anchor="middle" class="step">1</text><text x="430" y="181" class="node-title">应用程序发起写入</text><text x="430" y="201" class="node-sub">write() / fsync()</text></g>
  <g><rect x="370" y="255" width="360" height="64" rx="9" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><circle cx="398" cy="287" r="16" fill="#2563eb"/><text x="398" y="292" text-anchor="middle" class="step">2</text><text x="430" y="281" class="node-title">Guest 文件系统</text><text x="430" y="301" class="node-sub">转换为块设备请求</text></g>
  <g><rect x="370" y="355" width="360" height="64" rx="9" fill="#fff" stroke="#93c5fd" stroke-width="1.5"/><circle cx="398" cy="387" r="16" fill="#2563eb"/><text x="398" y="392" text-anchor="middle" class="step">3</text><text x="430" y="381" class="node-title">传统磁盘驱动</text><text x="430" y="401" class="node-sub">IDE / SATA / SCSI driver</text></g>
  <g><rect x="370" y="495" width="360" height="64" rx="9" fill="#fff" stroke="#fdba74" stroke-width="1.5"/><circle cx="398" cy="527" r="16" fill="#dc2626"/><text x="398" y="532" text-anchor="middle" class="step">5</text><text x="430" y="521" class="node-title">QEMU 模拟磁盘控制器</text><text x="430" y="541" class="node-sub">解析寄存器、DMA、中断和状态</text></g>
  <g><rect x="370" y="705" width="360" height="64" rx="9" fill="#fff" stroke="#86efac" stroke-width="1.5"/><circle cx="398" cy="737" r="16" fill="#16a34a"/><text x="398" y="742" text-anchor="middle" class="step">6</text><text x="430" y="731" class="node-title">宿主机块设备层</text><text x="430" y="751" class="node-sub">文件、LVM 或宿主机块设备</text></g>
  <g><rect x="370" y="860" width="360" height="48" rx="9" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="550" y="891" text-anchor="middle" class="node-title">物理磁盘 / SSD</text></g>

  <path d="M550 219 V255" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/>
  <path d="M550 319 V355" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/>
  <path d="M550 419 V495" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#blue)"/>
  <rect x="575" y="438" width="190" height="24" rx="5" fill="#fff"/>
  <text x="585" y="455" class="label">访问虚拟设备寄存器</text>
  <path d="M550 559 V705" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#green)"/>
  <rect x="575" y="617" width="150" height="24" rx="5" fill="#fff"/>
  <text x="585" y="634" class="label">宿主机 I/O 请求</text>
  <path d="M550 769 V860" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#green)"/>

  <path d="M370 387 H320 V527 H370" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#red)"/>
  <rect x="75" y="450" width="220" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="95" y="477" class="callout-title">4 触发 VM Exit</text>
  <text x="95" y="499" class="callout-sub">CPU 将控制权交给 VMM</text>
  <text x="95" y="518" class="callout-sub">VMM 捕获设备访问</text>

  <path d="M730 527 H760 V387 H730" stroke="#dc2626" stroke-width="2.2" fill="none" marker-end="url(#red)"/>
  <rect x="805" y="450" width="220" height="78" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="825" y="477" class="callout-title">7 返回 Guest</text>
  <text x="825" y="499" class="callout-sub">更新虚拟控制器状态</text>
  <text x="825" y="518" class="callout-sub">注入虚拟中断</text>

  <rect x="780" y="550" width="245" height="44" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="902" y="577" text-anchor="middle" class="callout-sub">设备模拟带来额外 CPU 开销</text>

  <line x1="75" y1="955" x2="110" y2="955" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue)"/><text x="120" y="960" class="subtitle">写请求主路径</text>
  <line x1="300" y1="955" x2="335" y2="955" stroke="#dc2626" stroke-width="2.2" marker-end="url(#red)"/><text x="345" y="960" class="subtitle">VM Exit / 设备模拟 / 返回</text>
  <line x1="620" y1="955" x2="655" y2="955" stroke="#16a34a" stroke-width="2.5" marker-end="url(#green)"/><text x="665" y="960" class="subtitle">宿主机实际磁盘 I/O</text>
</svg>
